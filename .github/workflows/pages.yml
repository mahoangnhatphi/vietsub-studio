name: Deploy client to GitHub Pages
on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The older desktop repo tracked large native tools and node_modules.
          # Fetch just the static web application's inputs.
          sparse-checkout: |
            src
            public
            scripts
            tests
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
